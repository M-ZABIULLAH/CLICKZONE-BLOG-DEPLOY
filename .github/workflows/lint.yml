name: Lint All Static Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Run HTMLHint on all HTML files
        run: htmlhint "**/*.html"

      - name: Install CSSLint
        run: npm install -g csslint

      - name: Run CSSLint
        run: csslint styles.css
